<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoboTV - Control</title>
<style>
  :root { --cy:#12b2e7; --bg:#07131a; --card:#0d2b3a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:#fff; font-family:'Segoe UI',Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; padding:20px; min-height:100vh; }
  h2 { color:var(--cy); margin-bottom:14px; font-weight:400; }
  .box { width:100%; max-width:350px; margin-bottom:18px; }
  input { width:100%; padding:14px; border-radius:10px; border:2px solid #1b4458; background:#04101a; color:#fff; font-size:16px; }
  .row { display:flex; margin-top:8px; }
  .row input { flex:1; margin-right:8px; }
  .btn-voice, .btn-small { border:none; font-weight:bold; border-radius:12px; cursor:pointer; color:#041016; background:linear-gradient(135deg,#12b2e7,#097498); }
  .btn-voice { width:100%; padding:18px; font-size:18px; box-shadow:0 5px 15px rgba(18,178,231,.4); }
  .btn-small { padding:0 18px; font-size:16px; }
  .btn-voice.listening { background:linear-gradient(135deg,#e74c3c,#a62b1f); color:#fff; }
  #status { margin-top:10px; font-size:15px; color:#9cb6c4; text-align:center; min-height:22px; }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); grid-gap:12px; width:100%; max-width:350px; }
  .rc { background:var(--card); color:#fff; border:2px solid #1b4458; padding:20px 0; font-size:20px; border-radius:12px; cursor:pointer; }
  .rc:active { background:var(--cy); color:#041016; }
  .full { grid-column:span 3; }
  #pair { font-size:12px; color:#5f7f8f; margin-top:6px; text-align:center; }
</style>
</head>
<body>
<h2>🐺 LoboTV Control</h2>

<div class="box" id="pairBox" style="display:none">
  <div style="margin-bottom:6px;color:#9cb6c4">Código que aparece en ⚙ Configuración del TV:</div>
  <div class="row"><input id="codeInput" placeholder="lobotv-xxxxxxxxxxxx"><button class="btn-small" onclick="savePair()">OK</button></div>
</div>

<div class="box">
  <button class="btn-voice" id="micBtn" onclick="startVoice()">🎙️ Buscar por voz</button>
  <div class="row"><input id="textInput" placeholder="o escribe: pon Avengers"><button class="btn-small" onclick="sendText()">▶</button></div>
  <div id="status">Di por ejemplo: “busca película Avengers” o “pon canal Caracol”</div>
  <div id="pair"></div>
</div>

<div class="box">
  <button class="btn-small" style="width:100%;padding:14px" onclick="toggleAdd()">➕ Agregar lista M3U</button>
  <div id="addBox" style="display:none">
    <div class="row"><input id="listName" placeholder="Nombre (ej. Latino2)"></div>
    <div class="row"><input id="listUrl" placeholder="URL M3U (http://...)" autocapitalize="none" autocorrect="off"></div>
    <label style="display:block;margin-top:8px;color:#9cb6c4;font-size:14px"><input type="checkbox" id="listLoad" checked style="width:auto;margin-right:6px">Cargarla en el TV ahora</label>
    <div class="row"><button class="btn-small" style="width:100%;padding:14px" onclick="addList()">Enviar al TV</button></div>
  </div>
</div>

<div class="pad">
  <div></div><button class="rc" onclick="key('up')">▲</button><div></div>
  <button class="rc" onclick="key('left')">◀</button><button class="rc" onclick="key('ok')">OK</button><button class="rc" onclick="key('right')">▶</button>
  <div></div><button class="rc" onclick="key('down')">▼</button><div></div>
  <button class="rc" onclick="key('settings')">⚙</button><button class="rc" onclick="key('search')">🔍</button><button class="rc" onclick="key('fav')">⭐</button>
  <button class="rc full" onclick="key('back')">Volver / Atrás</button>
</div>

<script>
var code = (location.hash || "").slice(1) || localStorage.getItem("lobotv_pair") || "";
var statusEl = document.getElementById("status");

function refreshPair() {
  if (code) localStorage.setItem("lobotv_pair", code);
  document.getElementById("pairBox").style.display = code ? "none" : "block";
  document.getElementById("pair").textContent = code ? "Emparejado: " + code + " (toca para cambiar)" : "";
}
document.getElementById("pair").onclick = function () { code = ""; localStorage.removeItem("lobotv_pair"); history.replaceState(null, "", location.pathname); refreshPair(); };
function savePair() {
  var v = document.getElementById("codeInput").value.trim();
  if (v) { code = v; refreshPair(); }
}

function send(payload) {
  if (!code) { statusEl.textContent = "Primero escribe el código del TV."; refreshPair(); return; }
  payload.time = Date.now();
  fetch("https://ntfy.sh/" + encodeURIComponent(code), { method: "POST", body: JSON.stringify(payload) })
    .catch(function () { statusEl.textContent = "Sin conexión a internet."; });
}
function key(action) { send({ type: "key", action: action }); }
function sendVoice(text) { statusEl.textContent = 'Enviado: "' + text + '"'; send({ type: "voice", query: text }); }
function sendText() {
  var t = document.getElementById("textInput").value.trim();
  if (t) { sendVoice(t); document.getElementById("textInput").value = ""; }
}

function toggleAdd() { var b = document.getElementById("addBox"); b.style.display = b.style.display === "none" ? "block" : "none"; }
function addList() {
  var name = document.getElementById("listName").value.trim();
  var url = document.getElementById("listUrl").value.trim();
  if (!/^https?:\/\//i.test(url)) { statusEl.textContent = "La URL debe empezar con http:// o https://"; return; }
  send({ type: "addlist", name: name, url: url, load: document.getElementById("listLoad").checked });
  statusEl.textContent = 'Lista "' + (name || "Lista móvil") + '" enviada al TV';
  document.getElementById("listName").value = ""; document.getElementById("listUrl").value = "";
}

function startVoice() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { statusEl.textContent = "Este navegador no tiene voz. Usa Chrome (Android) o el micrófono del teclado en el cuadro de texto."; return; }
  var rec = new SR(), btn = document.getElementById("micBtn");
  rec.lang = "es-CO"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = function () { btn.classList.add("listening"); statusEl.textContent = "Escuchando..."; };
  rec.onend = function () { btn.classList.remove("listening"); };
  rec.onresult = function (e) { sendVoice(e.results[0][0].transcript); };
  rec.onerror = function (e) { statusEl.textContent = e.error === "not-allowed" ? "Permite el micrófono en el navegador." : "No te entendí, intenta de nuevo."; };
  rec.start();
}
refreshPair();
</script>
</body>
</html>
